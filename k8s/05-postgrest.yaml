apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest-deployment
  namespace: desafio-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGRST_DB_SCHEMA
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGRST_DB_ANON_ROLE
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest-service
  namespace: desafio-k8s
spec:
  type: ClusterIP
  selector:
    app: postgrest
  ports:
    - port: 3000
      targetPort: 3000